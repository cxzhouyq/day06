<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录/注册 - 手机商城</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
        }
        .login-container {
            width: 400px;
            margin: 100px auto;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            padding: 30px;
        }
        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 1px solid #e0e0e0;
        }
        .tab {
            padding: 10px 20px;
            cursor: pointer;
            font-size: 16px;
        }
        .tab.active {
            color: #e4393c;
            border-bottom: 2px solid #e4393c;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: #e4393c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        .other-login {
            margin-top: 20px;
            text-align: center;
        }
        .other-login p {
            color: #999;
            position: relative;
        }
        .other-login p:before, .other-login p:after {
            content: "";
            position: absolute;
            top: 50%;
            width: 30%;
            height: 1px;
            background: #e0e0e0;
        }
        .other-login p:before {
            left: 0;
        }
        .other-login p:after {
            right: 0;
        }
        .icon-group {
            display: flex;
            justify-content: center;
            margin-top: 15px;
        }
        .icon-group .icon {
            width: 40px;
            height: 40px;
            margin: 0 10px;
            border-radius: 50%;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="tabs">
            <div class="tab active">账号登录</div>
            <div class="tab">手机登录</div>
            <div class="tab">注册账号</div>
        </div>
        
        <!-- 账号密码登录表单 -->
        <form id="account-login">
            <div class="form-group">
                <label for="username">用户名/邮箱</label>
                <input type="text" id="username" placeholder="请输入用户名或邮箱">
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" placeholder="请输入密码">
            </div>
            <button type="button" class="btn-login">登 录</button>
        </form>
        
        <div class="other-login">
            <p>其他登录方式</p>
            <div class="icon-group">
                <div class="icon">微</div>
                <div class="icon">Q</div>
                <div class="icon">支</div>
            </div>
        </div>
    </div>
</body>
</html>
